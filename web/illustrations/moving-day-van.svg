<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none" role="img" aria-labelledby="t d">
  <title id="t">The van at the kerb</title>
  <desc id="d">A small removal van at the kerb at dusk, its back open, boxes stacked on the wet pavement, a figure by the tailgate, and a cooling autumn sky above the rooftops.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#201A14"/><stop offset=".5" stop-color="#322820"/><stop offset="1" stop-color="#88A0B8" stop-opacity=".22"/></linearGradient>
    <linearGradient id="road" x2="0" y2="1"><stop stop-color="#201A14"/><stop offset="1" stop-color="#14110D"/></linearGradient>
  </defs>
  <rect width="800" height="640" fill="url(#sky)"/>
  <rect y="640" width="800" height="360" fill="url(#road)"/>
  <!-- rooftops -->
  <g fill="#14110D" opacity=".85"><path d="M0 420 h150 v220 h-150z"/><path d="M150 380 h150 v260 h-150z"/><path d="M620 400 h180 v240 h-180z"/></g>
  <g fill="#E9A05F" fill-opacity=".5"><rect x="40" y="470" width="30" height="40"/><rect x="200" y="440" width="30" height="40"/><rect x="680" y="460" width="30" height="40"/></g>
  <g fill="#F2ECE2" opacity=".4"><circle cx="300" cy="150" r="2.4"/><circle cx="470" cy="100" r="2"/><circle cx="560" cy="180" r="2.6"/><circle cx="180" cy="130" r="2"/></g>
  <!-- the van -->
  <g>
    <rect x="150" y="470" width="420" height="170" rx="8" fill="#201A14" stroke="#322820" stroke-width="5"/>
    <path d="M570 505 h105 l40 55 v80 h-145z" fill="#201A14" stroke="#322820" stroke-width="5"/>
    <rect x="590" y="520" width="78" height="42" rx="3" fill="#88A0B8" fill-opacity=".45"/>
    <rect x="175" y="492" width="372" height="126" rx="4" fill="#14110D" stroke="#322820" stroke-width="4"/>
    <!-- boxes inside -->
    <g stroke="#CE7A4A" stroke-width="3" fill="#201A14"><rect x="200" y="520" width="90" height="80"/><rect x="305" y="538" width="80" height="62"/></g>
    <circle cx="245" cy="648" r="38" fill="#14110D" stroke="#322820" stroke-width="5"/><circle cx="245" cy="648" r="15" fill="#322820"/>
    <circle cx="640" cy="648" r="38" fill="#14110D" stroke="#322820" stroke-width="5"/><circle cx="640" cy="648" r="15" fill="#322820"/>
  </g>
  <!-- boxes on the wet pavement -->
  <g stroke="#E9A05F" stroke-width="4" fill="#201A14">
    <rect x="300" y="700" width="130" height="110"/><line x1="300" y1="755" x2="430" y2="755"/><line x1="365" y1="700" x2="365" y2="810"/>
    <rect x="445" y="735" width="95" height="75"/>
  </g>
  <!-- reflection on wet road -->
  <g stroke="#CE7A4A" stroke-opacity=".25" stroke-width="6"><line x1="365" y1="820" x2="365" y2="900"/><line x1="490" y1="820" x2="490" y2="880"/></g>
  <!-- figure by the tailgate -->
  <g transform="translate(600,0)"><ellipse cx="70" cy="812" rx="46" ry="9" fill="#000" opacity=".3"/><path d="M70 700 C86 703 94 716 97 734 L104 812 L36 812 L43 734 C46 716 54 703 70 700Z" fill="#14110D"/><circle cx="70" cy="688" r="18" fill="#14110D"/></g>
</svg>
