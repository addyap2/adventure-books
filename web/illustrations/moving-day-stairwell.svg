<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none" role="img" aria-labelledby="t d">
  <title id="t">The stairwell</title>
  <desc id="d">A dim stairwell and a new doorway: someone carrying a box up worn steps toward a stuck key in the lock, with a figure waiting on the step below.</desc>
  <defs>
    <linearGradient id="swall" x2="0" y2="1"><stop stop-color="#322820"/><stop offset="1" stop-color="#14110D"/></linearGradient>
    <radialGradient id="door" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#E9A05F" stop-opacity=".55"/><stop offset="1" stop-color="#E9A05F" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#swall)"/>
  <!-- warm glow from the new door -->
  <ellipse cx="560" cy="330" rx="260" ry="300" fill="url(#door)"/>
  <!-- the new door -->
  <rect x="470" y="150" width="190" height="400" rx="4" fill="#201A14" stroke="#CE7A4A" stroke-width="6"/>
  <rect x="470" y="150" width="190" height="400" rx="4" fill="#E9A05F" fill-opacity=".14"/>
  <line x1="565" y1="150" x2="565" y2="550" stroke="#322820" stroke-width="3" opacity=".6"/>
  <!-- stuck key in the lock -->
  <g stroke="#E9A05F" stroke-width="5" fill="none"><circle cx="498" cy="360" r="10"/><line x1="498" y1="370" x2="498" y2="400"/><line x1="498" y1="392" x2="510" y2="392"/></g>
  <!-- worn steps -->
  <g fill="#201A14" stroke="#322820" stroke-width="3">
    <path d="M0 640 h800 v60 h-800z"/><path d="M90 700 h710 v70 h-710z"/><path d="M190 770 h610 v80 h-610z"/><path d="M300 850 h500 v90 h-500z"/>
  </g>
  <!-- figure carrying a box, mid-climb -->
  <g transform="translate(360,0)">
    <ellipse cx="90" cy="700" rx="44" ry="8" fill="#000" opacity=".3"/>
    <rect x="58" y="556" width="66" height="50" rx="3" fill="#201A14" stroke="#CE7A4A" stroke-width="4"/>
    <path d="M90 610 C106 613 114 626 117 646 L124 702 L56 702 L63 646 C66 626 74 613 90 610Z" fill="#14110D"/>
    <circle cx="90" cy="600" r="16" fill="#14110D"/>
  </g>
  <!-- figure waiting on the step below -->
  <g transform="translate(150,0)" opacity=".9">
    <ellipse cx="80" cy="930" rx="40" ry="8" fill="#000" opacity=".3"/>
    <path d="M80 820 C95 823 102 836 105 856 L112 930 L48 930 L55 856 C58 836 65 823 80 820Z" fill="#14110D"/>
    <circle cx="80" cy="806" r="17" fill="#14110D"/>
  </g>
</svg>
