<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none" role="img" aria-labelledby="t d">
  <title id="t">The old flat, emptying</title>
  <desc id="d">Bare rooms at the end of the day: pale rectangles where pictures hung, a few last boxes on the floor, and dusty afternoon light through an uncurtained window.</desc>
  <defs>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#201A14"/><stop offset="1" stop-color="#14110D"/></linearGradient>
    <linearGradient id="win" x2="0" y2="1"><stop stop-color="#88A0B8" stop-opacity=".55"/><stop offset="1" stop-color="#CE7A4A" stop-opacity=".22"/></linearGradient>
    <radialGradient id="dust" cx="38%" cy="34%" r="60%"><stop offset="0" stop-color="#E9A05F" stop-opacity=".18"/><stop offset="1" stop-color="#E9A05F" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#wall)"/>
  <rect x="0" y="720" width="800" height="280" fill="#14110D"/>
  <line x1="0" y1="720" x2="800" y2="720" stroke="#322820" stroke-width="3"/>
  <rect width="800" height="1000" fill="url(#dust)"/>
  <!-- window with cool dusk light -->
  <rect x="120" y="150" width="300" height="360" rx="4" fill="url(#win)" stroke="#322820" stroke-width="6"/>
  <line x1="270" y1="150" x2="270" y2="510" stroke="#322820" stroke-width="5"/>
  <line x1="120" y1="330" x2="420" y2="330" stroke="#322820" stroke-width="5"/>
  <!-- pale rectangles where pictures hung -->
  <g fill="#9C9286" fill-opacity=".14" stroke="#9C9286" stroke-opacity=".3" stroke-width="2">
    <rect x="520" y="210" width="140" height="180"/>
    <rect x="540" y="440" width="110" height="90"/>
  </g>
  <!-- last boxes -->
  <g stroke="#CE7A4A" stroke-width="4" fill="#201A14">
    <rect x="300" y="590" width="150" height="120"/>
    <line x1="300" y1="650" x2="450" y2="650"/><line x1="375" y1="590" x2="375" y2="710"/>
    <rect x="470" y="628" width="110" height="82"/>
    <line x1="470" y1="669" x2="580" y2="669"/>
  </g>
  <!-- bare lightbulb cord -->
  <line x1="600" y1="0" x2="600" y2="110" stroke="#322820" stroke-width="3"/>
  <circle cx="600" cy="122" r="14" fill="#E9A05F" fill-opacity=".5" stroke="#CE7A4A" stroke-width="3"/>
</svg>
